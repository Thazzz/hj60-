<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HJ60 Dashboard</title>

<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="/favicon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js" defer></script>

<link rel="icon" href="data:,">
    
</head>


<body>

<header class="header">

    <div class="headerCenter">

        <img src="/favicon.png" class="logo">

        <div class="headerText">
            <div class="title">HJ60 Werkplaats</div>
            <div class="subtitle">console & onderhoud</div>
        </div>
<div class="subtitle">live werkplaatsstatus</div>
    </div>

    <div class="headerStatus" id="status">
        status laden...
    </div>

</header>


<main class="dashboard">

    <section class="panel tasks">

        <h2>Klussen</h2>

        <ul id="taskList"></ul>

<h2>Periodiek onderhoud</h2>

<div class="maintenanceHeader">
    <span>Onderdeel</span>
    <span>Uitgevoerd op</span>
</div>

<div id="maintenanceList"></div>

    </section>


    <section class="panel calendar">

        <h2>Agenda</h2>

        <div class="calendarControls">

        <button id="prevMonth">◀</button>

        <div id="calendarTitle"></div>

        <button id="nextMonth">▶</button>

        </div>

        <div id="calendarGrid"></div>

    </section>


<section class="panel shopping">

    <div class="shoppingTop">
        <h2>Boodschappen</h2>

        <ul id="shoppingList">
            <li>laden...</li>
        </ul>
    </div>

    <div class="shoppingBottom">
        <h2>Uitrusting (vervangen)</h2>

        <div id="gearList">
            <div class="gearItem">nog geen data</div>
        </div>
    </div>

</section>

</main>


</body>
</html>
