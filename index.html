<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HJ60 Dashboard</title>

<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js" defer></script>

<link rel="icon" href="data:,">
    
</head>


<body>

<div class="headerLeft">
    <div class="title">HJ60</div>
    <div class="subtitle">Command Center</div>
</div>

<div class="headerStatus" id="status">
    status laden...
</div>


<main class="dashboard">

    <section class="panel tasks">

        <h2>Klussen</h2>

        <ul id="taskList"></ul>

<h2>Periodiek onderhoud</h2>

<div class="maintenanceHeader">
    <span>Onderdeel</span>
    <span>Uitgevoerd op</span>
</div>

<div id="maintenanceList"></div>

    </section>


    <section class="panel calendar">

        <h2>Agenda</h2>

        <div class="calendarControls">

        <button id="prevMonth">◀</button>

        <div id="calendarTitle"></div>

        <button id="nextMonth">▶</button>

        </div>

        <div id="calendarGrid"></div>

    </section>


    <section class="panel shopping">

        <h2>Boodschappen</h2>

        <div id="nextKlus">
            volgende klus: onbekend
        </div>

        <ul id="shoppingList">
            <li>laden...</li>
        </ul>

	<h2>Uitrusting (vervangen)</h2>

	<div id="gearList">
   	 <div class="gearItem">nog geen data</div>
	</div>

    </section>

</main>


</body>
</html>
