<!DOCTYPE html>

<html lang="nl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HJ60 PlannerApp</title>

<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="planner.css">
<link rel="icon" type="image/png" href="/favicon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/planner.js" defer></script>

<script src="js/tasks.js" defer></script>

<link rel="icon" href="data:,">

</head>

<body>

<header class="header">


<div class="title">
    🚙 Planner 🚙
</div>

<div class="subtitle">
    Plan je rit of de volgende klus
</div>


</header>

<main class="container">


<!-- FORM -->
<section class="card formCard">

<div style="margin-bottom:10px;">
    <button onclick="showTab('event')">Event</button>
    <button onclick="showTab('task')">Klus</button>
    <button onclick="showTab('gear')">Uitrusting</button>
</div>

   <div id="eventTab">

<h3 id="eventFormTitle">Nieuwe trip</h3>

<div class="formGroup">
    <label>Type</label>
    <select id="eventType">
        <option value="trip" selected>Trip</option>
        <option value="onderhoud">Onderhoud</option>
    </select>
</div>

    <!-- TRIP VELDEN -->
<div id="tripFields">

    <div class="formGroup">
        <label>Wie rijdt</label>
        <input id="owner" placeholder="Naam">
    </div>
    <div class="formGroup">
        <label>Jouw email (identiteit)</label>
        <input id="email" placeholder="bijv. thijs@email.nl">
    </div>

    <div class="formGroup">
        <label>Bestemming</label>
        <input id="destination" placeholder="Bijv. Ardennen">
    </div>

    <div class="formRow">
        <div class="formGroup">
            <label>Start</label>
            <input id="start" type="date">
        </div>

        <div class="formGroup">
            <label>Eind</label>
            <input id="end" type="date">
        </div>
    </div>

</div>

<!-- ONDERHOUD VELDEN -->
<div id="onderhoudFields" style="display:none;">

    <div class="formGroup">
        <label>Datum</label>
        <input id="onderhoudDate" type="date">
    </div>

    <div class="formGroup">
        <label>Locatie</label>
        <input id="location" placeholder="Garage / plaats">
    </div>

</div>

    <button id="saveBtn" class="primaryBtn">
        Opslaan
    </button>

<button id="deleteBtn" class="primaryBtn" style="background:#c0392b;">
        Verwijderen
    </button>

    <div id="feedback" class="feedback"></div>
<!-- 🔥 NIEUW: planning hieronder -->
    <hr style="margin:20px 0;">

    <h3>Planning (klik om te bewerken)</h3>

    <div id="tripList" class="tripList">
    laden...
</div>

</div> <!-- ✅ eventTab netjes afgesloten -->

<div id="taskTab" style="display:none;">

    <h3>Nieuwe klus</h3>

    <div class="formGroup">
        <label>Klus naam</label>
        <input id="taskTitle" placeholder="Bijv. Olie verversen">
    </div>

    <div class="formGroup">
        <label>Beschrijving</label>
        <textarea id="taskDesc"></textarea>
    </div>

    <div class="formGroup">
        <label>Prioriteit</label>
        <select id="taskPriority">
            <option value="1">🔴 Hoog</option>
            <option value="2">🟠 Midden</option>
            <option value="3">🟢 Laag</option>
        </select>
    </div>

    <div class="formGroup">
        <label>Eigenaar</label>
        <input id="taskOwner" placeholder="Naam">
    </div>

    <div class="formGroup">
        <label>Boodschappen</label>
        <textarea id="taskShopping"></textarea>
    </div>

    <button onclick="saveTask()" class="primaryBtn">
        Opslaan
    </button>

    <button id="deleteTaskBtn" class="primaryBtn" style="background:#c0392b; display:none;">
    Verwijderen
    </button>

<hr style="margin:20px 0;">

<h3>Klussen (klik om te bewerken)</h3>

<div id="taskListPlanner">
    laden...
</div>



</div>

<!-- uitrusting velden -->
<div id="gearTab" style="display:none;">

    <h3>Nieuwe uitrusting</h3>

    <div class="formGroup">
        <label>Naam</label>
        <input id="gearName" placeholder="Bijv. Tent">
    </div>

    <div class="formGroup">
        <label>Status</label>
        <select id="gearStatus">
            <option value="ok">🟢 OK</option>
            <option value="slijtage">🟠 Slijtage</option>
            <option value="vervangen">🔴 Vervangen</option>
        </select>
    </div>

    <div class="formGroup">
        <label>Eigenaar</label>
        <input id="gearOwner" placeholder="Naam">
    </div>

    <button onclick="saveGear()" class="primaryBtn">
        Opslaan
    </button>
     <button id="deleteGearBtn" class="primaryBtn" style="background:#c0392b; display:none;">
    Verwijderen
     </button>
    <hr>

    <h3>Uitrusting</h3>

    <div id="gearListPlanner">
        laden...
    </div>



</div>
</section>





</main>

</body>
</html>
