<!DOCTYPE html>

<html lang="nl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HJ60 Planner</title>

<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="planner.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/planner.js" defer></script>

<link rel="icon" href="data:,">

</head>

<body>

<header class="header">


<div class="title">
    🚙 Planner
</div>

<div class="subtitle">
    Plan je rit
</div>


</header>

<main class="container">


<!-- FORM -->
<section class="card formCard">

    <h2>Nieuw Event</h2>
<div class="formGroup">
    <label>Type</label>
    <select id="eventType">
        <option value="trip" selected>Trip</option>
        <option value="onderhoud">Onderhoud</option>
    </select>
</div>

    <!-- TRIP VELDEN -->
<div id="tripFields">

    <div class="formGroup">
        <label>Wie rijdt</label>
        <input id="owner" placeholder="Naam">
    </div>
    <div class="formGroup">
        <label>Jouw email (identiteit)</label>
        <input id="email" placeholder="bijv. thijs@email.nl">
    </div>

    <div class="formGroup">
        <label>Bestemming</label>
        <input id="destination" placeholder="Bijv. Ardennen">
    </div>

    <div class="formRow">
        <div class="formGroup">
            <label>Start</label>
            <input id="start" type="date">
        </div>

        <div class="formGroup">
            <label>Eind</label>
            <input id="end" type="date">
        </div>
    </div>

</div>

<!-- ONDERHOUD VELDEN -->
<div id="onderhoudFields" style="display:none;">

    <div class="formGroup">
        <label>Datum</label>
        <input id="onderhoudDate" type="date">
    </div>

    <div class="formGroup">
        <label>Locatie</label>
        <input id="location" placeholder="Garage / plaats">
    </div>

</div>

    <button id="saveBtn" class="primaryBtn">
        Opslaan
    </button>

<button id="deleteBtn" class="primaryBtn" style="background:#c0392b;">
        Verwijderen
    </button>

    <div id="feedback" class="feedback"></div>

</section>


<!-- TRIP LIST -->
<section class="card listCard">

    <h2>Planning (klik om te bewerken)</h2>

    <div id="tripList" class="tripList">
        laden...
    </div>

</section>


</main>

</body>
</html>
